<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Par o Impar</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container py-5">

    <div class="card">

        <div class="card-body">

            <h1>Par o Impar</h1>

            <p>
                Escribe un número para saber si es par o impar.
            </p>

            <form method="post">

                <input
                    type="number"
                    name="numero"
                    class="form-control mb-3"
                    placeholder="Ej: 8"
                    required
                >

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Comprobar
                </button>

            </form>


            {% if resultado %}

                <div class="alert alert-success mt-3">

                    {{ resultado }}

                </div>

            {% endif %}


            <!-- BOTONES PARA LOS OTROS EJERCICIOS -->

            <hr>

            <h3>Otros ejercicios</h3>

            <a href="/tabla" class="btn btn-success">
                Tabla de multiplicar
            </a>

            <a href="/adivina" class="btn btn-warning">
                Adivina el número
            </a>

        </div>

    </div>

</div>

</body>

</html>
